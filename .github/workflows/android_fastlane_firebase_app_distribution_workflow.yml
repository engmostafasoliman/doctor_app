name: Android Fastlane with Firebase App Distribution

on:
  push:
    branches:
      - master

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libffi-dev

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3.0"    
        bundler-cache: true
        working-directory: android

    - name: Add missing gems
      run: |
        echo 'gem "abbrev"' >> android/Gemfile
        bundle install
      working-directory: android
      
    - name: تثبيت التبعيات
      run: |
        bundle add abbrev --version '~> 0.1.1'
        bundle update fastlane



    - name: Build and Distribute App
      env:
        FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
      run: bundle exec fastlane android firebase_distribution
      working-directory: android
